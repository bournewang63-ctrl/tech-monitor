name: 每小時更新監測儀表板

on:
  schedule:
    - cron: "17 * * * *"      # 每小時第 17 分執行（UTC，避開整點尖峰）
  workflow_dispatch:           # 可在 Actions 頁面手動執行
    inputs:
      test_semantic:
        description: "順便測試語意層（拿現有未分類項目跑一次，印出分數）"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["config/**", "build.py", "collect.py", "monitor/**"]

permissions:
  contents: write              # 把新資料 commit 回倉庫
  pages: write
  id-token: write

concurrency:
  group: hourly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                # 一律取最新版（排隊中的執行不會用到舊版本）

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 快取語意模型          # 約 470MB，第一次執行後就不用重新下載
        uses: actions/cache@v4
        with:
          path: .fastembed_cache
          key: fastembed-paraphrase-multilingual-MiniLM-L12-v2

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 收集資料
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # 讓 GitHub 搜尋 API 有較高額度
          AIMON_SEMANTIC: "1"                         # 開啟語意相似度層
          AIMON_SEM_DEBUG: "1"                        # 在執行紀錄印出分數，方便調門檻
          FASTEMBED_CACHE_PATH: .fastembed_cache
        run: python collect.py

      - name: 產生儀表板
        run: python build.py

      - name: 儲存資料到倉庫
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 先對齊遠端最新版本，只提交 data/，避免和其他執行或手動修改衝突
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q origin/main
            git add data
            if git diff --cached --quiet; then echo "沒有新資料"; break; fi
            git commit -q -m "data: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push -q origin HEAD:main && break
            sleep 5
          done

      - name: 測試語意層（僅手動勾選時執行）
        if: ${{ inputs.test_semantic }}
        env:
          AIMON_SEMANTIC: "1"
          AIMON_SEM_DEBUG: "1"
          AIMON_SEM_MAX: "600"
          FASTEMBED_CACHE_PATH: .fastembed_cache
        run: |
          python - <<'PY'
          from monitor import semantic, store
          from monitor.classify import Classifier
          clf = Classifier()
          items = list(store.load_months(2).values())
          for it in items:  # 以最新關鍵字重新判定，挑出完全沒分到類的
              e = it.get("extra", {})
              text = " ".join([it["title"], it.get("summary", ""),
                               " ".join(e.get("keywords") or []), " ".join(e.get("topics") or [])])
              t, _ = clf.classify(text)
              it["topics"] = list(dict.fromkeys(t + it.get("hints", []) + it.get("base", []))) or it.get("defaults", [])
          print("未分類項目：", sum(1 for it in items if not it["topics"]), "／", len(items))
          print(semantic.enrich(items, clf, debug=True))
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
