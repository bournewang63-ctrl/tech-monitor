# 主題關鍵字設定
# ─ 英文關鍵字：不分大小寫、整個單字比對，容許字尾 s/es/ed/ing
#   （"robot" 會比對到 robots，但不會比對到 robotics；"encrypt" 會比對到 encrypted / encrypting）
# ─ 詞之間的空白、連字號、底線視為同一種寫法：post-quantum = post quantum = postquantum
# ─ 以 "=" 開頭：區分大小寫（例如 "=AI" 不會比對到 "said"）
# ─ 中文關鍵字：子字串比對，中間空白可有可無
# ─ weak：弱關鍵字，要同時命中 requires 中任一主題才算數
#   （例如 "agents" 太常見，只有在同時是 AI 相關主題時才算 AI Agent）
# 修改後下一次排程就會套用；舊資料在重新建置時也會重新分類。

topics:
  llm:
    name: 大型語言模型
    short: LLM
    color: "#ef4444"
    keywords: [LLM, LLMs, large language model, language model, GPT-, ChatGPT, Claude, Gemini, Llama, Qwen, DeepSeek,
               Mistral, Grok, reasoning model, fine-tuning, fine-tune, RLHF, RAG, retrieval-augmented, context window,
               tokenizer, small language model, "=SLM", mixture of experts, "=MoE", system prompt, chain of thought,
               大型語言模型, 語言模型, 大模型, 推理模型, 推理鏈]
