# 主題關鍵字設定
# ─ 英文關鍵字：不分大小寫、以單字邊界比對（"robot" 會比對到 robots / robotics）
# ─ 以 "=" 開頭：區分大小寫（例如 "=AI" 不會比對到 "said"）
# ─ 中文關鍵字：直接子字串比對
# ─ weak：弱關鍵字，要同時命中 requires 中任一主題才算數（避免「conference」把所有研討會都算進來）
# 修改後下一次排程就會套用；舊資料在重新建置時也會重新分類。

topics:
  llm:
    name: 大型語言模型
    short: LLM
    color: "#ef4444"
    keywords: [LLM, LLMs, large language model, language model, GPT-, ChatGPT, Claude, Gemini, Llama, Qwen, DeepSeek,
               Mistral, Grok, reasoning model, fine-tuning, fine-tune, RLHF, RAG, retrieval-augmented, context window,
               tokenizer, 大型語言模型, 語言模型, 大模型, 推理模型]
